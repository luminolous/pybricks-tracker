[project]
name = "pybricks-tracker"
version = "0.0.1"
description = "Desktop telemetry and map tracking for a Pybricks line-following robot"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# Hub programs are MicroPython (rendered from Jinja2, or static tools), never
# linted as CPython.
extend-exclude = ["app/codegen/templates", "tools/hub"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
